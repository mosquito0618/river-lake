<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江湖补给 · 水位互动演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(160deg, #cfdfec 0%, #e8f2f9 100%);
            font-family: 'Segoe UI', 'Noto Sans SC', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .main-card {
            max-width: 850px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 3.2rem;
            box-shadow: 0 35px 55px rgba(0, 35, 50, 0.2), inset 0 0 0 1px rgba(255,255,255,0.8);
            padding: 2.2rem 2rem 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        h2 {
            text-align: center;
            font-weight: 600;
            font-size: 2.1rem;
            color: #0b3e54;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #255b6e;
            font-style: italic;
            margin-bottom: 0.3rem;
            border-bottom: 2px dashed #9bbdce;
            padding-bottom: 0.7rem;
        }

        /* 示意图区域 */
        .diagram {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 0.3rem;
            position: relative;
            height: 280px;
            margin: 0.5rem 0 0.8rem;
        }

        .water-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 30%;
            position: relative;
        }

        .label {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
            color: #144a5e;
            z-index: 3;
        }

        .tank {
            width: 100%;
            max-width: 160px;
            height: 220px;
            background: rgba(185, 211, 224, 0.45);
            border-radius: 1.8rem 1.8rem 1.2rem 1.2rem;
            border: 2px solid #7aa3b8;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 -8px 12px rgba(0,0,0,0.05);
            transition: border 0.2s;
        }

        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            transition: height 0.5s cubic-bezier(0.2, 0.9, 0.4, 1);
            background: linear-gradient(180deg, #3192b0 0%, #135d79 100%);
            box-shadow: inset 0 6px 12px rgba(255,255,255,0.35);
            border-radius: 0 0 1.2rem 1.2rem;
        }

        .lake-water {
            background: linear-gradient(180deg, #2e9c8b 0%, #166859 100%);
        }

        /* 连接水道 */
        .connector {
            width: 25%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 220px;
            position: relative;
        }

        .pipe-bg {
            width: 100%;
            height: 45px;
            background: linear-gradient(180deg, #8ba9ba, #658394);
            border-radius: 2rem;
            margin-bottom: 50px;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .flow-direction {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 2px 8px black;
            transition: all 0.3s;
            z-index: 3;
            position: relative;
        }

        .arrow-char {
            display: inline-block;
            animation: flowPulse 0.9s infinite ease-in-out;
        }

        @keyframes flowPulse {
            0% { transform: translateX(0); opacity: 0.7; }
            50% { transform: translateX(8px); opacity: 1; }
            100% { transform: translateX(0); opacity: 0.7; }
        }

        .reverse .arrow-char {
            animation: flowPulseRev 0.9s infinite ease-in-out;
        }

        @keyframes flowPulseRev {
            0% { transform: translateX(0); opacity: 0.7; }
            50% { transform: translateX(-8px); opacity: 1; }
            100% { transform: translateX(0); opacity: 0.7; }
        }

        .status-bar {
            background: #e3f0f7;
            border-radius: 3rem;
            padding: 0.8rem 1.5rem;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: #0a4053;
            transition: background 0.3s;
        }

        /* 控制面板 */
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            justify-content: center;
            align-items: flex-start;
        }

        .slider-group {
            background: rgba(255,255,255,0.7);
            border-radius: 2rem;
            padding: 1rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            min-width: 200px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.05);
        }

        .slider-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #0f4055;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #bdd5e4;
            border-radius: 6px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #0f566e;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px #053e52;
            border: 2px solid white;
        }

        .scene-buttons {
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .btn {
            border: none;
            background: white;
            padding: 0.7rem 1.5rem;
            border-radius: 2.5rem;
            font-weight: 600;
            color: #0c3e51;
            box-shadow: 0 6px 14px rgba(0,60,80,0.1);
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #b6cfde;
            background: #f9fcff;
        }

        .btn:hover {
            background: #dfeffa;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(0,70,90,0.15);
        }

        .btn.active {
            background: #105069;
            color: white;
            border-color: #105069;
        }

        .explain-box {
            background: #ebf5fb;
            border-radius: 1.8rem;
            padding: 0.9rem 1.4rem;
            font-size: 0.95rem;
            color: #1b4758;
            line-height: 1.6;
            border: 1px solid #c5ddec;
            margin-top: 0.2rem;
        }

        .highlight {
            font-weight: 700;
            color: #074257;
        }

        @media (max-width: 600px) {
            .diagram {
                height: 220px;
            }
            .tank {
                height: 160px;
                max-width: 100px;
            }
            .control-panel {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
<div class="main-card">
    <h2>🌊 长江 ↔ 鄱阳湖</h2>
    <div class="subtitle">水位差决定补给方向 · 连通器与顶托</div>

    <!-- 可视化示意图 -->
    <div class="diagram">
        <!-- 长江 -->
        <div class="water-body">
            <div class="label">🏞️ 长江 (干流)</div>
            <div class="tank" id="riverTank">
                <div class="water" id="riverWater" style="height: 40%;"></div>
            </div>
        </div>

        <!-- 连接水道 + 箭头 -->
        <div class="connector">
            <div class="pipe-bg" id="pipe">
                <div class="flow-direction" id="flowArrow">
                    <span class="arrow-char">←</span>
                </div>
            </div>
        </div>

        <!-- 鄱阳湖 -->
        <div class="water-body">
            <div class="label">🌿 鄱阳湖</div>
            <div class="tank" id="lakeTank">
                <div class="water lake-water" id="lakeWater" style="height: 70%;"></div>
            </div>
        </div>
    </div>

    <!-- 状态信息 -->
    <div class="status-bar" id="statusMsg">
        湖水补给长江 (水位差 → 快)
    </div>

    <!-- 交互控制 -->
    <div class="control-panel">
        <div class="slider-group">
            <div class="slider-item">
                <div class="slider-header"><span>🌊 长江水位</span><span id="riverVal">40%</span></div>
                <input type="range" id="riverSlider" min="10" max="90" value="40" step="1">
            </div>
            <div class="slider-item">
                <div class="slider-header"><span>🌿 鄱阳湖水位</span><span id="lakeVal">70%</span></div>
                <input type="range" id="lakeSlider" min="10" max="90" value="70" step="1">
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.8rem; align-items: center;">
            <div class="scene-buttons">
                <button class="btn active" id="btnDry">💧 枯水期典型</button>
                <button class="btn" id="btnWet">🌧️ 丰水期典型</button>
                <button class="btn" id="btnEqual">⚖️ 水位接近</button>
            </div>
            <div class="explain-box" id="explainText">
                💡 <span class="highlight">连通器原理</span>：长江与鄱阳湖通过湖口水道相连，水总是从水位高处流向低处。当前湖泊水位高于长江，湖水外泄补给长江。
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // DOM 元素
        const riverWater = document.getElementById('riverWater');
        const lakeWater = document.getElementById('lakeWater');
        const flowArrow = document.getElementById('flowArrow');
        const statusMsg = document.getElementById('statusMsg');
        const explainText = document.getElementById('explainText');
        const riverSlider = document.getElementById('riverSlider');
        const lakeSlider = document.getElementById('lakeSlider');
        const riverVal = document.getElementById('riverVal');
        const lakeVal = document.getElementById('lakeVal');
        const btnDry = document.getElementById('btnDry');
        const btnWet = document.getElementById('btnWet');
        const btnEqual = document.getElementById('btnEqual');

        // 当前水位百分比 (0-100)
        let riverLevel = 40;
        let lakeLevel = 70;

        // 更新所有视觉元素
        function updateDisplay() {
            // 更新水位高度
            riverWater.style.height = riverLevel + '%';
            lakeWater.style.height = lakeLevel + '%';
            riverVal.textContent = riverLevel + '%';
            lakeVal.textContent = lakeLevel + '%';
            riverSlider.value = riverLevel;
            lakeSlider.value = lakeLevel;

            const diff = riverLevel - lakeLevel;
            const absDiff = Math.abs(diff);
            let direction = '';
            let speedDesc = '';
            let arrowHtml = '';
            let arrowClass = '';

            // 判断水流方向及速度描述
            if (diff > 0.5) {
                // 长江水位高于湖泊：江水补给湖泊 (倒灌/顶托)
                direction = 'river2lake';
                arrowHtml = '<span class="arrow-char">→</span>';
                arrowClass = '';
                if (absDiff > 20) speedDesc = '流速快，江水大量倒灌入湖';
                else if (absDiff > 8) speedDesc = '中速，江水明显补给湖泊';
                else speedDesc = '顶托微弱，江水缓慢入湖';
            } else if (diff < -0.5) {
                // 湖泊水位高于长江：湖水补给长江
                direction = 'lake2river';
                arrowHtml = '<span class="arrow-char">←</span>';
                arrowClass = 'reverse';
                if (absDiff > 20) speedDesc = '流速快，湖水大量外泄入江';
                else if (absDiff > 8) speedDesc = '中速，湖水稳定补给长江';
                else speedDesc = '水位差小，湖水外泄缓慢';
            } else {
                // 水位接近，交换微弱
                direction = 'equal';
                arrowHtml = '<span style="font-size:1.5rem;">↔</span>';
                arrowClass = '';
                speedDesc = '水位几乎持平，水流交换微弱';
            }

            // 更新箭头
            flowArrow.innerHTML = arrowHtml;
            flowArrow.className = 'flow-direction ' + arrowClass;

            // 更新状态消息
            let stateText = '';
            if (direction === 'river2lake') {
                stateText = '长江补给鄱阳湖 (江水 → 湖泊)';
            } else if (direction === 'lake2river') {
                stateText = '鄱阳湖补给长江 (湖水 → 长江)';
            } else {
                stateText = '江湖水位持平，补给微弱';
            }
            statusMsg.textContent = `${stateText} · ${speedDesc}`;

            // 更新解释文本
            let explanation = '';
            if (direction === 'river2lake') {
                explanation = `💡 <span class="highlight">江水倒灌/顶托</span>：长江水位高出鄱阳湖，江水通过湖口水道涌入湖泊（倒灌）。即使湖泊水位稍高，当长江涨水较快时也会“顶托”湖水下泄，减慢流速。`;
            } else if (direction === 'lake2river') {
                explanation = `💡 <span class="highlight">湖水外泄补给</span>：鄱阳湖流域降水多，湖水水位高于长江，水自然流向低处，补给长江干流。`;
            } else {
                explanation = `💡 <span class="highlight">连通器平衡</span>：两边水位几乎相等，水流交换极弱。现实中常出现在枯水季或短暂平衡期。`;
            }
            // 补充连通性说明
            explanation += ` 长江与鄱阳湖通过<strong>湖口</strong>这一天然水道连通，如同一个巨大的连通器。`;
            explainText.innerHTML = explanation;
        }

        // 滑块事件
        riverSlider.addEventListener('input', (e) => {
            riverLevel = parseInt(e.target.value, 10);
            updateDisplay();
            updateActiveButton();
        });

        lakeSlider.addEventListener('input', (e) => {
            lakeLevel = parseInt(e.target.value, 10);
            updateDisplay();
            updateActiveButton();
        });

        // 场景按钮
        function setScene(river, lake) {
            riverLevel = river;
            lakeLevel = lake;
            updateDisplay();
            updateActiveButton();
        }

        btnDry.addEventListener('click', () => {
            setScene(35, 70); // 枯水期：长江较低，鄱阳湖较高
        });

        btnWet.addEventListener('click', () => {
            setScene(78, 48); // 丰水期：长江高，湖水被托高但相对低
        });

        btnEqual.addEventListener('click', () => {
            setScene(55, 56); // 水位接近
        });

        function updateActiveButton() {
            btnDry.classList.remove('active');
            btnWet.classList.remove('active');
            btnEqual.classList.remove('active');
            if (riverLevel === 35 && lakeLevel === 70) btnDry.classList.add('active');
            else if (riverLevel === 78 && lakeLevel === 48) btnWet.classList.add('active');
            else if (riverLevel === 55 && lakeLevel === 56) btnEqual.classList.add('active');
        }

        // 初始化
        updateDisplay();
    })();
</script>
</body>
</html>
